name: lantern-binaries

# Builds the SOCKS-only Lantern core (liblantern_novpn.so) for the app.
#
# Place this file at:  .github/workflows/lantern-binaries.yml
#
# What this version does:
#
#  1. lantern-box pin ladder (lantern_box_version = auto):
#        - take the N newest lantern-box tags (lantern_box_candidates, default 4),
#        - keep only the ones NEWER than what radiance pins,
#        - for each (newest first) run `go get`, copy the sagernet replace directives of that
#          lantern-box release into go.mod and do a quick host compile check,
#        - the first one that compiles wins; if none does, the upstream pin is used.
#     "upstream" (or empty) = exactly what radiance pins.  "v0.0.171" = force that one.
#  2. The lantern-box version really linked into every binary is read back and compared with what
#     the ladder chose. A mismatch fails verification, so a wrong core is never published.
#  3. If the SOCKS core does not compile with the chosen lantern-box on Android, the first ABI
#     falls back to the upstream pin and says so (LB fallback).
#  4. patch-netmon.sh makes a failing netlink network monitor non-fatal (idempotent, re-run after a
#     fallback).
#  5. Build identity: BuildTime and Commit are injected when radiance declares them. Version is only
#     injected with inject_version.
#  6. Soar zone / key injection and all the "facts" reports are unchanged.
#  7. NEW: "Facts - DNS rules and rule-set ga-ir" prints where Lantern builds the DNS rules and the
#     ga-ir rule-set (sing-box 1.14 rejects a DNS rule that mixes an IP-only rule-set with query_type /
#     evaluate: "Legacy Address Filter Fields in DNS rules"). The result is uploaded as dns-facts.txt.

on:
  workflow_dispatch:
    inputs:
      radiance_ref:
        description: "radiance branch/tag/commit (use a commit SHA once you have a build you trust)"
        default: "main"
      lantern_box_version:
        description: "auto = newest lantern-box that compiles; upstream = what radiance pins; or a tag such as v0.0.171"
        default: "auto"
      lantern_box_candidates:
        description: "auto mode: how many of the newest lantern-box tags to try (newest first)"
        default: "4"
      package:
        description: "Go package"
        default: "./cmd/lanternd"
      build_tags:
        description: "Go build tags (comma separated), WITHOUT the SOCKS tag"
        default: "with_gvisor,with_quic,with_wireguard,with_utls,with_grpc,with_clash_api,standalone"
      socks_tag:
        description: "Tag that selects the SOCKS backend: 'novpn' on radiance main; 'stealth_novpn' only on the PR #486 branch"
        default: "novpn"
      soar_zone:
        description: "Optional Soar zone (your own soar-server -zone). Prefer the SOAR_ZONE secret"
        default: ""
      soar_public_key:
        description: "Optional Soar server public key. Prefer the SOAR_PUBLIC_KEY secret"
        default: ""
      dns_drop_rulesets:
        description: "Comma separated rule-set tags whose DNS rules are dropped at sing-box level (sing-box 1.14 rejects them: 'Legacy Address Filter Fields'). Empty = no patch"
        default: "ga-ir"
      inject_version:
        description: "Also inject common.Version (nana-<commit>). Off by default: the server may read the client version"
        type: boolean
        default: false
      build_armv7:
        description: "Also build armeabi-v7a (32-bit ARM). May fail, never blocks the job"
        type: boolean
        default: true
      build_x86_64:
        description: "Also build x86_64 (emulators, Chromebooks, some tablets). May fail, never blocks the job"
        type: boolean
        default: true
      build_x86:
        description: "Also build x86 (32-bit, old emulators). May fail, never blocks the job"
        type: boolean
        default: false
      build_default:
        description: "Also build the TUN liblantern.so (the app cannot use it; leave off)"
        type: boolean
        default: false

env:
  GH_PAT: ${{ secrets.GH_PAT }}   # optional, only for private modules
  TAGS: ${{ inputs.build_tags }}
  SOCKS_TAG: ${{ inputs.socks_tag }}
  PKG: ${{ inputs.package }}
  LB_REQ: ${{ inputs.lantern_box_version }}
  LB_TRY: ${{ inputs.lantern_box_candidates }}
  # go get / go mod edit change go.mod and go.sum; builds must be allowed to follow them.
  GOFLAGS: -mod=mod
  DNS_DROP: ${{ inputs.dns_drop_rulesets }}

jobs:
  binary:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          repository: getlantern/radiance
          ref: ${{ inputs.radiance_ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Private modules (only if GH_PAT secret exists)
        if: ${{ env.GH_PAT != '' }}
        run: |
          git config --global url."https://${GH_PAT}@github.com/".insteadOf "https://github.com/"
          echo "GOPRIVATE=github.com/getlantern/*" >> $GITHUB_ENV

      - name: Download modules (upstream state)
        run: |
          set -o pipefail
          go mod download 2>&1 | tee deps.log
          cp go.mod go.mod.upstream
          cp go.sum go.sum.upstream

      # ------------------------------------------------------------------------------------
      # Helper scripts. Created first so every later step (and the fallback inside the build)
      # uses the very same code.
      # ------------------------------------------------------------------------------------
      - name: Prepare helper scripts
        run: |
          # ---- patch-netmon.sh ------------------------------------------------------------
          # Connect died on Android with "create network monitor: netlink socket in Android is
          # banned by Google". sing-box treats a failing network monitor as fatal only when
          # route.auto_detect_interface is on. A SOCKS-only core has nothing to detect (the app
          # excludes its own UID from the TUN), so the failure must be non-fatal. Two independent
          # patches, both idempotent.
          #
          # Side effect: with no interface monitor the daemon does not notice a Wi-Fi <-> mobile
          # switch by itself. The app compensates (LanternManager.onNetworkChanged).
          cat > patch-netmon.sh <<'EOF'
          #!/usr/bin/env bash
          set +e
          echo "## radiance: AutoDetectInterface before"
          grep -rn -i "AutoDetectInterface\|auto_detect_interface" --include=*.go . | grep -v _test.go
          echo "## 1) radiance: never request auto-detect"
          grep -rl -i "AutoDetectInterface\|auto_detect_interface" --include=*.go vpn backend config 2>/dev/null | grep -v _test.go | while read -r f; do
            perl -pi -e 's/(AutoDetectInterface\s*[:=]+\s*)true/${1}false/g; s/("auto_detect_interface"\s*:\s*)true/${1}false/g' "$f"
            echo "patched $f"
          done
          echo "## radiance: after"
          grep -rn -i "AutoDetectInterface\|auto_detect_interface" --include=*.go . | grep -v _test.go
          echo "## 2) sing-box: make a failing network monitor non-fatal"
          D="$(go list -m -f '{{if .Replace}}{{.Replace.Dir}}{{else}}{{.Dir}}{{end}}' github.com/sagernet/sing-box)"
          F="$D/route/network.go"
          echo "sing-box dir: $D"
          if [ -f "$F" ]; then
            chmod -R u+w "$D" 2>/dev/null
            echo "-- code around the error, before:"
            grep -n -B6 -A8 'create network monitor' "$F" | head -60
            if grep -q 'enforceInterfaceMonitor := options.AutoDetectInterface' "$F"; then
              sed -i 's/enforceInterfaceMonitor := options.AutoDetectInterface/enforceInterfaceMonitor := false/' "$F"
              echo "PATCHED sing-box: enforceInterfaceMonitor := false"
            elif grep -q 'enforceInterfaceMonitor := false' "$F"; then
              echo "sing-box already patched"
            else
              echo "::warning::route/network.go has no 'enforceInterfaceMonitor := options.AutoDetectInterface' line. Send patch-log.txt"
            fi
          else
            echo "::warning::$F not found"
          fi
          EOF
          chmod +x patch-netmon.sh

          # ---- patch-dnsrules.sh ----------------------------------------------------------
          # Field log: "fetch rule-set ga-ir : validate dns rule[3]: Legacy Address Filter Fields in
          # DNS rules is deprecated". The tag ga-ir is not in radiance or lantern-box: it comes from
          # the config server. sing-box 1.14 rejects a DNS rule that points at an IP-only rule-set
          # while the DNS rules also use query_type (radiance adds those itself), so the rule-set
          # never loads, every start waits ~10 s for it and the fetch fails again.
          # In a SOCKS-only core the DNS rule that uses ga-ir has no job, so it is dropped where
          # sing-box builds its DNS router (it is the single consumer, so it also covers rules that
          # arrive from the config later). The result is compiled right away; if it does not compile
          # the patch is reverted and the build goes on unpatched.
          cat > patch-dnsrules.sh <<'EOF'
          #!/usr/bin/env bash
          set +e
          DROP="${DNS_DROP:-}"
          if [ -z "$DROP" ]; then echo "dns_drop_rulesets is empty: no DNS patch"; exit 0; fi
          D="$(go list -m -f '{{if .Replace}}{{.Replace.Dir}}{{else}}{{.Dir}}{{end}}' github.com/sagernet/sing-box)"
          F="$D/dns/router.go"
          echo "sing-box dir: $D"
          echo "rule-set tags to drop from DNS rules: $DROP"
          if [ ! -f "$F" ]; then echo "::warning::$F not found, DNS patch skipped"; exit 0; fi
          chmod -R u+w "$D" 2>/dev/null
          if grep -q 'dnsfixDropRules' "$F"; then echo "sing-box dns router already patched"; exit 0; fi
          echo "-- NewRouter before:"
          grep -n -A3 'func NewRouter' "$F" | head -12
          cp "$F" "$F.dnsfix.bak"
          # The helper is APPENDED to the existing router.go. A NEW file in the module cache is not
          # seen by go build (the module index of the cache is treated as immutable): the first
          # attempt with a separate zz_dnsfix.go failed with "undefined: dnsfixDropRules". An edited
          # existing file is read from disk, exactly like the netmon patch. No new imports are needed.
          CASES="$(echo "$DROP" | tr ',' '\n' | sed 's/[[:space:]]//g; /^$/d; s/.*/"&"/' | paste -sd, -)"
          if [ -z "$CASES" ]; then echo "no usable rule-set tag in [$DROP]: no DNS patch"; exit 0; fi
          {
            echo ''
            echo '// ---- dnsfix (added by the build, see patch-dnsrules.sh) ----'
            echo 'func dnsfixDropTag(tag string) bool {'
            echo '	switch tag {'
            echo "	case $CASES:"
            echo '		return true'
            echo '	}'
            echo '	return false'
            echo '}'
          } >> "$F"
          cat >> "$F" <<'GOEOF'

          func dnsfixMatch(r option.DNSRule) bool {
          	if r.Type == "logical" {
          		for _, sub := range r.LogicalOptions.Rules {
          			if dnsfixMatch(sub) {
          				return true
          			}
          		}
          		return false
          	}
          	for _, tag := range r.DefaultOptions.RuleSet {
          		if dnsfixDropTag(tag) {
          			return true
          		}
          	}
          	return false
          }

          func dnsfixDropRules(rules []option.DNSRule) []option.DNSRule {
          	out := make([]option.DNSRule, 0, len(rules))
          	for _, r := range rules {
          		if !dnsfixMatch(r) {
          			out = append(out, r)
          		}
          	}
          	return out
          }
          GOEOF
          echo "-- where the DNS rules enter the router:"
          grep -n -E 'func \(r \*Router\) (Initialize|Start|buildRules)|options\.Rules|rawRules' "$F" | head -20
          # Hook 1: NewRouter(options) - kept, harmless when options.Rules is not what the router uses.
          perl -0pi -e 's/(func NewRouter\([^{]*\{\n)/$1\toptions.Rules = dnsfixDropRules(options.Rules)\n/' "$F"
          # Hook 2: Initialize(rules []option.DNSRule) - in sing-box 1.12+ this is where box.go hands over
          # the DNS rules (and the router keeps them as rawRules for the later rule-set re-validation).
          perl -0pi -e 's/(func \(\w+ \*Router\) Initialize\((\w+) \[\]option\.DNSRule\)[^{]*\{\n)/$1\t$2 = dnsfixDropRules($2)\n/' "$F"
          HOOKS="$(grep -c 'dnsfixDropRules' "$F")"
          echo "hooks inserted: $HOOKS"
          if [ "$HOOKS" = 0 ]; then
            echo "::warning::found neither NewRouter(...) nor Initialize(rules []option.DNSRule) in dns/router.go; DNS patch reverted. Send patch-dns-log.txt"
            cp "$F.dnsfix.bak" "$F"; exit 0
          fi
          if ! grep -q -E '^\s+\w+ = dnsfixDropRules\(\w+\)$' "$F"; then
            echo "::warning::the Initialize hook was NOT inserted: the DNS patch may have no effect (NewRouter only). Send patch-dns-log.txt"
          fi
          if GODEBUG=goindex=0 go build -tags "$TAGS,$SOCKS_TAG" github.com/sagernet/sing-box/dns > dnsfix-compile.log 2>&1; then
            echo "PATCHED sing-box dns router: DNS rules that use [$DROP] are dropped"
            grep -n -B1 -A2 'dnsfixDropRules' "$F" | head -20
          else
            echo "::warning::DNS patch did not compile; reverted. Send patch-dns-log.txt"
            tail -30 dnsfix-compile.log
            cp "$F.dnsfix.bak" "$F"
          fi
          EOF
          chmod +x patch-dnsrules.sh

          # ---- ci-build-core.sh -----------------------------------------------------------
          #   ./ci-build-core.sh <abi>      abi = arm64-v8a | armeabi-v7a | x86_64 | x86
          # Attempts: the full tag set (or the one that worked for the first ABI), then a slimmer
          # one (without with_wireguard and standalone). If the pinned lantern-box was the problem
          # (LB_PINNED=1) a last attempt restores the upstream go.mod/go.sum and tries again; that
          # decision is global (written to GITHUB_ENV), so every ABI is built from the same modules.
          # No -v: it prints every package name and buries the one error line.
          cat > ci-build-core.sh <<'EOF'
          #!/usr/bin/env bash
          set -uo pipefail
          ABI="$1"
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          PAGE=""
          case "$ABI" in
            arm64-v8a)   GOARCH_=arm64; GOARM_="";  CLANG="aarch64-linux-android24-clang";     PAGE="-Wl,-z,max-page-size=16384" ;;
            armeabi-v7a) GOARCH_=arm;   GOARM_="7"; CLANG="armv7a-linux-androideabi24-clang"   ;;
            x86_64)      GOARCH_=amd64; GOARM_="";  CLANG="x86_64-linux-android24-clang";      PAGE="-Wl,-z,max-page-size=16384" ;;
            x86)         GOARCH_=386;   GOARM_="";  CLANG="i686-linux-android24-clang"         ;;
            *) echo "::error::unknown ABI $ABI"; exit 2 ;;
          esac
          CC_BIN="$TC/$CLANG"
          CXX_BIN="$TC/${CLANG}++"
          if [ ! -x "$CXX_BIN" ]; then echo "::error::NDK has no $CLANG++"; exit 1; fi
          OUT="out/$ABI/liblantern_novpn.so"
          mkdir -p "out/$ABI"

          build_core() {  # $1 tags, $2 log file
            CGO_ENABLED=1 GOOS=android GOARCH="$GOARCH_" GOARM="$GOARM_" CC="$CC_BIN" CXX="$CXX_BIN" \
            go build -trimpath -buildmode=pie -tags "$1" \
              -ldflags "-s -w -checklinkname=0 ${XFLAGS:-} -linkmode=external -extld=$CXX_BIN -extldflags '-static-libstdc++ $PAGE'" \
              -o "$OUT" "$PKG" > "$2" 2>&1
          }

          FULL="$TAGS,$SOCKS_TAG"
          SLIM="$(echo "$TAGS" | tr ',' '\n' | grep -v -x -e with_wireguard -e standalone | paste -sd, - || true),$SOCKS_TAG"
          FIRST="${USED_TAGS:-$FULL}"

          ok=0
          try_set() {  # $1 name, $2 tags
            local name="$1" tags="$2"
            echo "::group::$ABI attempt $name  tags=$tags"
            if build_core "$tags" "build-$ABI-$name.log"; then
              echo "built OK"
              echo "$tags" > "out/$ABI/.used_tags"
              if [ -z "${USED_TAGS:-}" ]; then echo "USED_TAGS=$tags" >> "$GITHUB_ENV"; fi
              echo "::endgroup::"
              return 0
            fi
            echo "FAILED, last 50 lines:"
            tail -50 "build-$ABI-$name.log"
            echo "::endgroup::"
            return 1
          }

          try_set first "$FIRST" && ok=1
          if [ "$ok" != 1 ] && [ "$SLIM" != "$FIRST" ]; then try_set slim "$SLIM" && ok=1; fi

          if [ "$ok" != 1 ] && [ "${LB_PINNED:-0}" = 1 ]; then
            echo "::warning::$ABI did not compile with the pinned lantern-box ${LB_EXPECT:-?}: falling back to the upstream pin for ALL ABIs"
            cp go.mod.upstream go.mod
            cp go.sum.upstream go.sum
            go mod download 2>&1 | tail -5
            ./patch-netmon.sh > patch-log-fallback.txt 2>&1 || true
            ./patch-dnsrules.sh > patch-dns-fallback.txt 2>&1 || true
            NEW_LB="$(go list -m -f '{{.Version}}' github.com/getlantern/lantern-box)"
            echo "LB_EXPECT=$NEW_LB" >> "$GITHUB_ENV"
            echo "LB_PINNED=0" >> "$GITHUB_ENV"
            echo "LB_FALLBACK=1" >> "$GITHUB_ENV"
            echo "lantern-box FALLBACK to upstream $NEW_LB (the pinned one did not compile on Android)" | tee -a "$GITHUB_STEP_SUMMARY"
            try_set upstream-lb "$FIRST" && ok=1
            if [ "$ok" != 1 ] && [ "$SLIM" != "$FIRST" ]; then try_set upstream-lb-slim "$SLIM" && ok=1; fi
          fi

          if [ "$ok" != 1 ]; then
            rm -f "$OUT"
            echo "::error::$ABI SOCKS core did not compile. See build-$ABI-*.log (artifact lantern-report-and-logs)."
            exit 1
          fi
          file "$OUT"
          ls -lh "$OUT"
          EOF
          chmod +x ci-build-core.sh

      # ------------------------------------------------------------------------------------
      # lantern-box pin ladder.
      # ------------------------------------------------------------------------------------
      - name: Choose lantern-box (pin ladder)
        run: |
          set +e
          LBM=github.com/getlantern/lantern-box
          UP_LB="$(go list -m -f '{{.Version}}' $LBM 2>/dev/null)"
          echo "radiance pins lantern-box: ${UP_LB:-unknown}"
          : > lb-pin.log

          # Copies the replace lines for sagernet modules from the chosen lantern-box go.mod into
          # ours when theirs is newer. Go ignores replace directives of dependencies, so without this
          # a newer lantern-box keeps compiling against radiance's older sing-box fork.
          align_replaces() {
            local LBDIR; LBDIR="$(go list -m -f '{{.Dir}}' $LBM 2>/dev/null)"
            [ -f "$LBDIR/go.mod" ] || { echo "no go.mod for lantern-box in the module cache"; return 0; }
            go mod edit -json "$LBDIR/go.mod" | jq -r '.Replace[]? | select(.Old.Path | test("^github.com/sagernet/")) | select(.New.Version != null and .New.Version != "") | "\(.Old.Path)|\(.New.Path)|\(.New.Version)"' | while IFS='|' read -r old newp newv; do
              cur="$(go mod edit -json go.mod | jq -r --arg o "$old" '.Replace[]? | select(.Old.Path==$o) | .New.Version' | head -1)"
              if [ -z "$cur" ]; then
                go mod edit -replace "$old=$newp@$newv"; echo "replace added:   $old => $newp@$newv"
              elif [ "$cur" != "$newv" ] && [ "$(printf '%s\n%s\n' "$cur" "$newv" | sort -V | tail -1)" = "$newv" ]; then
                go mod edit -replace "$old=$newp@$newv"; echo "replace updated: $old => $newp@$newv (was $cur)"
              else
                echo "replace kept:    $old (ours $cur, lantern-box $newv)"
              fi
            done
          }

          # Host compile check (fast, no NDK). It only tells "does radiance still build against this
          # lantern-box"; the real Android build happens later.
          compile_check() {
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags "$TAGS,$SOCKS_TAG" -o /dev/null "$PKG" > "$1" 2>&1
          }

          CANDS=""
          EXPLICIT=0
          case "$LB_REQ" in
            ""|upstream) CANDS="" ;;
            auto)
              CANDS="$(go list -m -versions $LBM 2>/dev/null | tr ' ' '\n' | tail -n +2 | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n "${LB_TRY:-4}" | sort -rV)"
              ;;
            *) CANDS="$LB_REQ"; EXPLICIT=1 ;;
          esac
          echo "candidates (newest first): $(echo $CANDS)"

          BASE_OK=0
          if [ -n "$CANDS" ]; then
            if compile_check check-upstream.log; then BASE_OK=1; echo "host compile check works on the upstream state"; else
              echo "::warning::host compile check fails even on the upstream state; candidates will be accepted without it (the Android build decides)"
              tail -15 check-upstream.log
            fi
          fi

          CHOSEN=""
          for v in $CANDS; do
            if [ "$EXPLICIT" = 0 ]; then
              [ "$v" = "$UP_LB" ] && continue
              if [ -n "$UP_LB" ] && [ "$(printf '%s\n%s\n' "$UP_LB" "$v" | sort -V | tail -1)" != "$v" ]; then
                echo "skip $v (not newer than $UP_LB)"; continue
              fi
            fi
            echo "::group::try lantern-box $v"
            cp go.mod.upstream go.mod; cp go.sum.upstream go.sum
            if ! go get "$LBM@$v" >> lb-pin.log 2>&1; then
              echo "go get failed:"; tail -20 lb-pin.log; echo "::endgroup::"; continue
            fi
            align_replaces
            go mod download >> lb-pin.log 2>&1
            if [ "$BASE_OK" = 1 ]; then
              if compile_check "check-$v.log"; then CHOSEN="$v"; echo "compiles"; else echo "does NOT compile with radiance:"; tail -25 "check-$v.log"; fi
            else
              CHOSEN="$v"
            fi
            echo "::endgroup::"
            [ -n "$CHOSEN" ] && break
          done

          if [ -z "$CHOSEN" ]; then
            cp go.mod.upstream go.mod; cp go.sum.upstream go.sum
            go mod download >> lb-pin.log 2>&1
            [ -n "$CANDS" ] && echo "::warning::no newer lantern-box compiled with this radiance checkout; using the upstream pin ${UP_LB:-?}"
          fi

          EXPECT="$(go list -m -f '{{.Version}}' $LBM 2>/dev/null)"
          echo "LB_EXPECT=$EXPECT" >> "$GITHUB_ENV"
          echo "LB_PINNED=$([ -n "$CHOSEN" ] && echo 1 || echo 0)" >> "$GITHUB_ENV"
          echo "LB_FALLBACK=0" >> "$GITHUB_ENV"
          {
            echo "### lantern-box"
            echo "- requested: \`${LB_REQ:-upstream}\`"
            echo "- radiance pins: \`${UP_LB:-?}\`"
            echo "- **using: \`$EXPECT\`**"
          } >> "$GITHUB_STEP_SUMMARY"
          diff -u go.mod.upstream go.mod > go-mod.diff 2>&1
          echo "---- go.mod changes vs upstream:"
          cat go-mod.diff

      # Read-only facts about this exact radiance checkout: which files the SOCKS tag
      # gates, and what the SOCKS backend does. Uploaded as source-facts.txt.
      - name: Source facts
        if: always()
        run: |
          {
            echo "## radiance commit"; git log -1 --format='%H %cd %s' 2>&1
            echo; echo "## go"; go version
            echo; echo "## files gated by a *novpn* build tag"
            grep -rn -E '^//go:build.*novpn' --include=*.go . | head -60
            echo; echo "## vpn/ files that mention novpn"; ls vpn | grep -i novpn
            echo; echo "## vpn/boxoptions_novpn.go"; cat vpn/boxoptions_novpn.go 2>&1
            echo; echo "## vpn/boxoptions_default.go (first 25 lines)"; sed -n '1,25p' vpn/boxoptions_default.go 2>&1
            echo; echo "## where the config request gets its 'platform' (HTTP 400: bad client factors: getting platform)"
            grep -rn "getting platform\|bad client factors" --include=*.go . | grep -v _test.go | head -20
            grep -rn "func .*[Pp]latform()" --include=*.go common config | head -20
            echo; echo "## who reads RADIANCE_SOCKS_ADDRESS / device id"
            grep -rn "RADIANCE_SOCKS_ADDRESS\|RADIANCE_USE_SOCKS_PROXY\|RADIANCE_DEVICE_ID" --include=*.go . | head -20
            grep -rn "DeviceIDKey" --include=*.go common/settings | head -10
            echo; echo "## IPC routes (the app pins a server with POST /vpn/connect {\"tag\": ...})"
            grep -rn -E '"(GET|POST|PUT|DELETE) ?/?[a-z]*/[a-z_/-]+"|HandleFunc|Handle\(' --include=*.go ipc 2>/dev/null | grep -v _test.go | head -60
            grep -rn -E 'ConnectRequest|SelectServer|selected_server|SelectedServer' --include=*.go . 2>/dev/null | grep -v _test.go | head -30
          } > source-facts.txt 2>&1 || true
          echo "::group::source-facts.txt"
          cat source-facts.txt
          echo "::endgroup::"

      # Facts about the modules that decide how the core behaves under load: the auto-select
      # group (stall handling) and the DNS tunnel (Soar / dnstt). Nothing here changes the build.
      - name: Module facts (auto-select, Soar)
        if: always()
        run: |
          set +e
          {
            echo "## versions"
            go list -m github.com/getlantern/radiance github.com/getlantern/lantern-box github.com/getlantern/kindling github.com/getlantern/soar github.com/getlantern/dnstt github.com/sagernet/sing-box 2>&1
            LB="$(go list -m -f '{{if .Replace}}{{.Replace.Dir}}{{else}}{{.Dir}}{{end}}' github.com/getlantern/lantern-box 2>/dev/null)"
            echo; echo "## lantern-box auto-select files ($LB)"
            ls "$LB/protocol/group" 2>&1 | grep -i -E 'autoselect|history|dataplane|probe'
            echo; echo "## stall / confirmation / recovery-gate handling in auto-select"
            grep -n -i -E 'stall|confirm|recovery|gate|ladder|excluding' "$LB"/protocol/group/mutableautoselect*.go 2>/dev/null | grep -v _test | head -80
            echo; echo "## files that mention soar (radiance)"
            grep -rli soar --include=*.go . | head -40
            echo; echo "## string variables with an empty default in soar-related files (ldflags -X candidates)"
            for root in . "$(go list -m -f '{{.Dir}}' github.com/getlantern/kindling 2>/dev/null)" "$(go list -m -f '{{.Dir}}' github.com/getlantern/soar 2>/dev/null)"; do
              [ -d "$root" ] || continue
              grep -rliE soar --include=*.go "$root" 2>/dev/null | grep -v _test.go | while read -r f; do
                grep -nHE '^[[:space:]]*(var[[:space:]]+)?[A-Za-z_]+[[:space:]]+(string[[:space:]]*)?=[[:space:]]*""' "$f"
              done
            done | head -40
          } > soar-facts.txt 2>&1
          echo "::group::soar-facts.txt"
          cat soar-facts.txt
          echo "::endgroup::"
          {
            echo "### Linked modules"
            echo '```'
            go list -m github.com/getlantern/radiance github.com/getlantern/lantern-box github.com/getlantern/kindling github.com/getlantern/soar github.com/getlantern/dnstt 2>&1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # NEW. Read-only. Why the daemon logs
      #   "fetch rule-set ga-ir : validate dns rule[3]: Legacy Address Filter Fields in DNS rules ..."
      # sing-box 1.14 rejects a DNS rule that points to an IP-only rule-set (GeoIP style) while the
      # DNS rules also use 1.14 fields (query_type / evaluate). This step prints where Lantern
      # generates those rules and the ga-ir rule-set, so the next change can be an exact patch.
      - name: Facts - DNS rules and rule-set ga-ir
        if: always()
        run: |
          set +e
          {
            echo "## ga-ir / geoip-ir references (radiance)"
            grep -rn -E 'ga-ir|geoip-ir|ga_ir' --include=*.go . | grep -v _test.go | head -40
            LB="$(go list -m -f '{{if .Replace}}{{.Replace.Dir}}{{else}}{{.Dir}}{{end}}' github.com/getlantern/lantern-box 2>/dev/null)"
            echo; echo "## ga-ir / geoip-ir references (lantern-box: $LB)"
            [ -d "$LB" ] && grep -rn -E 'ga-ir|geoip-ir|ga_ir' --include=*.go "$LB" | grep -v _test.go | head -40
            echo; echo "## where DNS rules are built (radiance)"
            grep -rn -E 'DNSRule|DefaultDNSRule|QueryType|MatchResponse|"evaluate"' --include=*.go vpn config 2>/dev/null | grep -v _test.go | head -60
            echo; echo "## where DNS rules are built (lantern-box)"
            [ -d "$LB" ] && grep -rn -E 'DNSRule|QueryType|MatchResponse|"evaluate"' --include=*.go "$LB" | grep -v _test.go | head -60
            echo; echo "## rule_set definitions with a URL (who downloads rule-sets at start)"
            grep -rn -E 'RuleSet|rule_set|ruleset' --include=*.go vpn config 2>/dev/null | grep -v _test.go | head -40
            echo; echo "## sing-box dir and dns rule validation"
            D="$(go list -m -f '{{if .Replace}}{{.Replace.Dir}}{{else}}{{.Dir}}{{end}}' github.com/sagernet/sing-box 2>/dev/null)"
            echo "$D"
            grep -rn "Legacy Address Filter Fields" --include=*.go "$D" 2>/dev/null | head -10
            echo; echo "## newest lantern-box tags"
            go list -m -versions github.com/getlantern/lantern-box 2>/dev/null | tr ' ' '\n' | tail -8
          } > dns-facts.txt 2>&1
          echo "::group::dns-facts.txt"
          cat dns-facts.txt
          echo "::endgroup::"

      - name: Locate NDK
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$NDK" ]; then NDK="$(ls -d $ANDROID_HOME/ndk/* | sort -V | tail -1)"; fi
          echo "NDK=$NDK" >> $GITHUB_ENV
          test -x "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++"

      # Builds XFLAGS (extra -X linker flags):
      #  - build identity (BuildTime / Commit, and Version only with inject_version) when common/
      #    declares those variables
      #  - Soar zone + public key, only when YOU provided both AND the variables were found
      # Values are masked in the log and never printed. Nothing is invented: a variable that is
      # not found is simply skipped and reported.
      - name: Discover ldflags (build identity + Soar)
        env:
          SOAR_ZONE: ${{ secrets.SOAR_ZONE || inputs.soar_zone }}
          SOAR_PUBKEY: ${{ secrets.SOAR_PUBLIC_KEY || inputs.soar_public_key }}
          INJECT_VERSION: ${{ inputs.inject_version }}
        run: |
          set +e
          [ -n "$SOAR_ZONE" ] && echo "::add-mask::$SOAR_ZONE"
          [ -n "$SOAR_PUBKEY" ] && echo "::add-mask::$SOAR_PUBKEY"
          MOD="$(go list -m -f '{{.Path}}')"
          SHORT="$(git rev-parse --short=10 HEAD)"
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          XF=""

          has_var() {  # $1 = file glob, $2 = variable name
            grep -hE "^[[:space:]]*(var[[:space:]]+)?$2[[:space:]]+(string[[:space:]]*)?=" $1 >/dev/null 2>&1
          }
          SPECS="BuildTime=${NOW} Commit=${SHORT}"
          if [ "$INJECT_VERSION" = "true" ]; then SPECS="Version=nana-${SHORT} $SPECS"; fi
          for spec in $SPECS; do
            n="${spec%%=*}"; v="${spec#*=}"
            if has_var "common/*.go" "$n"; then
              XF="$XF -X $MOD/common.$n=$v"
              echo "identity: $MOD/common.$n set"
            else
              echo "identity: common.$n not declared in this checkout, skipped"
            fi
          done

          # Finds "import/path.VarName" of the first string variable matching $1 in a file that
          # mentions soar, searching radiance, kindling, soar and lantern-box.
          find_soar_var() {
            for entry in ".|$MOD" \
              "$(go list -m -f '{{.Dir}}' github.com/getlantern/kindling 2>/dev/null)|github.com/getlantern/kindling" \
              "$(go list -m -f '{{.Dir}}' github.com/getlantern/soar 2>/dev/null)|github.com/getlantern/soar" \
              "$(go list -m -f '{{.Dir}}' github.com/getlantern/lantern-box 2>/dev/null)|github.com/getlantern/lantern-box"; do
              dir="${entry%%|*}"; mp="${entry#*|}"
              [ -d "$dir" ] || continue
              grep -rlE "^[[:space:]]*(var[[:space:]]+)?($1)[[:space:]]+(string[[:space:]]*)?=" --include=*.go "$dir" 2>/dev/null | grep -v _test.go | while read -r f; do
                if echo "$f" | grep -qi soar || grep -qi soar "$f"; then
                  rel="$(dirname "${f#"$dir"/}")"
                  pkg="$mp"; [ "$rel" != "." ] && pkg="$mp/$rel"
                  name="$(grep -ohE "^[[:space:]]*(var[[:space:]]+)?($1)" "$f" | head -1 | sed -E 's/^[[:space:]]*(var[[:space:]]+)?//')"
                  echo "$pkg.$name"
                fi
              done
            done | head -1
          }

          SOAR_INJECTED=0
          if [ -n "$SOAR_ZONE" ] && [ -n "$SOAR_PUBKEY" ]; then
            ZV="$(find_soar_var 'Zone|SoarZone')"
            KV="$(find_soar_var 'PublicKey|PubKey|SoarPublicKey')"
            echo "soar zone variable:       ${ZV:-NOT FOUND}"
            echo "soar public key variable: ${KV:-NOT FOUND}"
            if [ -n "$ZV" ] && [ -n "$KV" ]; then
              XF="$XF -X $ZV=$SOAR_ZONE -X $KV=$SOAR_PUBKEY"
              SOAR_INJECTED=1
              echo "Soar zone and key will be linked into the core" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::Soar values were given but the variables were not found. Read soar-facts.txt (last section lists the candidates) and send it to me."
            fi
          else
            echo "No Soar values given: Soar is built exactly as upstream does it (disabled unless upstream embeds its own)."
          fi

          echo "XFLAGS=$XF" >> "$GITHUB_ENV"
          echo "SOAR_INJECTED=$SOAR_INJECTED" >> "$GITHUB_ENV"

      - name: Patch - no fatal netlink network monitor
        run: ./patch-netmon.sh 2>&1 | tee patch-log.txt

      - name: Patch - drop DNS rules that sing-box 1.14 rejects (ga-ir)
        run: ./patch-dnsrules.sh 2>&1 | tee patch-dns-log.txt

      - name: Build arm64-v8a SOCKS core -> liblantern_novpn.so (required)
        run: ./ci-build-core.sh arm64-v8a

      - name: Build x86_64 SOCKS core (allowed to fail)
        if: ${{ inputs.build_x86_64 }}
        continue-on-error: true
        run: ./ci-build-core.sh x86_64

      - name: Build armeabi-v7a SOCKS core (allowed to fail)
        if: ${{ inputs.build_armv7 }}
        continue-on-error: true
        run: ./ci-build-core.sh armeabi-v7a

      - name: Build x86 SOCKS core (allowed to fail)
        if: ${{ inputs.build_x86 }}
        continue-on-error: true
        run: ./ci-build-core.sh x86

      # Proof from each finished binary, not from the command line:
      #  - the Go build info must list the SOCKS tag
      #  - the TUN option builder (boxoptions_default.go) must not be linked in
      #  - the lantern-box version linked into the binary must be the one that was chosen
      #  - when Soar values were linked, the zone must be present in the binary (warning only)
      # core-info.txt carries the sha256: the app prints the first 16 hex digits in its log.
      # Every binary that exists is checked; one bad binary fails the whole step, so a
      # wrong core can never be published next to the good ones.
      - name: Verify every core is the SOCKS build
        id: verify
        continue-on-error: true
        env:
          SOAR_ZONE: ${{ secrets.SOAR_ZONE || inputs.soar_zone }}
        run: |
          : > core-info.txt
          {
            echo "### Core check"
            echo "| ABI | SOCKS tag \`$SOCKS_TAG\` | TUN builder linked (must be 0) | SOCKS builder linked | lantern-box in binary | expected | Soar zone | sha256 (first 16) |"
            echo "|---|---|---|---|---|---|---|---|"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          bad=0
          found=0
          for f in out/*/liblantern_novpn.so; do
            [ -f "$f" ] || continue
            found=$((found+1))
            abi="$(basename "$(dirname "$f")")"
            {
              echo "=================== $abi"
              echo "file: $f"; sha256sum "$f"; ls -l "$f"; file "$f"
              echo "used tags: $(cat "out/$abi/.used_tags" 2>/dev/null)"
              go version -m "$f"
            } >> core-info.txt 2>&1
            has_tag=0
            if go version -m "$f" | grep -E 'build[[:space:]]+-tags=' | sed 's/.*-tags=//' | tr ',' '\n' | grep -qx "$SOCKS_TAG"; then has_tag=1; fi
            tun_refs="$(strings -a "$f" | grep -c 'boxoptions_default.go' || true)"
            socks_refs="$(strings -a "$f" | grep -c 'boxoptions_novpn.go' || true)"
            lb_in="$(go version -m "$f" | awk '$1=="dep" && $2=="github.com/getlantern/lantern-box" {print $3}' | head -1)"
            soar_state="n/a"
            if [ "${SOAR_INJECTED:-0}" = 1 ] && [ -n "$SOAR_ZONE" ]; then
              if strings -a "$f" | grep -qF -- "$SOAR_ZONE"; then soar_state="yes"; else soar_state="NOT FOUND"; echo "::warning::$abi: the Soar zone was passed to the linker but is not visible in the binary (the variable may be unused or stored differently)"; fi
            fi
            echo "| $abi | $([ $has_tag = 1 ] && echo yes || echo NO) | $tun_refs | $socks_refs | ${lb_in:-?} | ${LB_EXPECT:-?} | $soar_state | $(sha256sum "$f" | cut -c1-16) |" | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "$has_tag" != 1 ] || [ "$tun_refs" != 0 ]; then
              echo "::error::$abi liblantern_novpn.so is NOT a SOCKS-only build (tag present: $has_tag, TUN code references: $tun_refs)"
              bad=1
            fi
            if [ -n "${LB_EXPECT:-}" ] && [ "$lb_in" != "$LB_EXPECT" ]; then
              echo "::error::$abi: lantern-box in the binary is '${lb_in:-?}' but the build was meant to use '$LB_EXPECT'"
              bad=1
            fi
          done
          grep -E 'path|build[[:space:]]+(-tags|GOARCH|CGO_ENABLED|vcs\.revision)|go1\.|^=====' core-info.txt || true
          if [ "$found" = 0 ]; then echo "::error::no core was built"; exit 1; fi
          if [ ! -f out/arm64-v8a/liblantern_novpn.so ]; then echo "::error::the required arm64-v8a core is missing"; exit 1; fi
          if [ "$bad" != 0 ]; then exit 1; fi
          echo "all $found core(s) OK: SOCKS-only build, lantern-box ${LB_EXPECT:-?}"
          {
            echo
            echo "In the app log the new core shows up as: \`dep ... lantern-box ${LB_EXPECT:-?}\` and a new sha256. If the log still shows an older version the old .so is still in the APK."
          } >> "$GITHUB_STEP_SUMMARY"

      # Opt-in only. The TUN build cannot run in the app (needs netlink), and shipping it
      # next to the SOCKS one invites a silent fallback to the wrong core.
      # Built AFTER verification so it can never influence the SOCKS check.
      - name: Build arm64-v8a TUN core -> liblantern.so (opt-in)
        if: ${{ inputs.build_default }}
        continue-on-error: true
        run: |
          set -o pipefail
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CC_BIN="$TC/aarch64-linux-android24-clang"
          CXX_BIN="$TC/aarch64-linux-android24-clang++"
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 CC="$CC_BIN" CXX="$CXX_BIN" \
          go build -trimpath -buildmode=pie -tags "$TAGS" \
            -ldflags "-s -w -checklinkname=0 -linkmode=external -extld=$CXX_BIN -extldflags '-static-libstdc++ -Wl,-z,max-page-size=16384'" \
            -o out/arm64-v8a/liblantern.so "$PKG" 2>&1 | tee build-arm64-default.log

      - name: What was produced
        if: always()
        run: |
          rm -f out/*/.used_tags
          ls -lh out/*/ 2>/dev/null || echo "nothing in out/"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lantern-report-and-logs
          path: |
            source-facts.txt
            soar-facts.txt
            dns-facts.txt
            patch-log.txt
            patch-log-fallback.txt
            patch-dns-log.txt
            patch-dns-fallback.txt
            dnsfix-compile.log
            core-info.txt
            go-mod.diff
            deps.log
            lb-pin.log
            check-*.log
            build-*.log
          if-no-files-found: ignore

      # Only verified SOCKS cores are published as the "liblantern" artifact.
      # Layout: out/<abi>/liblantern_novpn.so  ->  jniLibs/<abi>/ in the app.
      - uses: actions/upload-artifact@v4
        if: ${{ steps.verify.outcome == 'success' }}
        with:
          name: liblantern
          path: out/

      - name: Fail the job if a core is not the SOCKS build
        if: ${{ always() && steps.verify.outcome == 'failure' }}
        run: |
          echo "::error::Core verification failed: nothing was published as 'liblantern'. See core-info.txt and source-facts.txt in lantern-report-and-logs."
          exit 1
